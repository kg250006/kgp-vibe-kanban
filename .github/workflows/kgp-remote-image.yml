name: KGP Remote Image

# Builds the self-hosted Vibe Kanban Cloud image (crates/remote) and pushes it
# to GHCR. The KGP VM pulls this image; it never builds locally.
# Self-hosted build: FEATURES is left empty, so the Dockerfile strips the
# private billing dependency (see crates/remote/Dockerfile).

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kg250006/kgp-vibe-kanban-remote

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile declares --mount=type=ssh for upstream's private billing
      # dep. Our FEATURES-empty build never fetches it, but BuildKit still
      # requires an agent socket for the mount, so provide an empty one.
      - name: Start empty ssh-agent
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/remote/Dockerfile
          push: true
          ssh: default
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_RELAY_API_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
